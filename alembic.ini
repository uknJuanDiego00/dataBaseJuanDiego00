[alembic]
# Ruta al script de entorno (no modificar)
script_location = alembic

# Plantilla para nombres de archivos de migración
file_template = %%(rev)s_%%(slug)s

# Codificación del sistema de archivos
prepend_sys_path = .

# Timezone para fechas en migraciones
timezone = UTC

# Formato de fecha en cabecera de migración
# (se puede ajustar)
# revision_environment = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

